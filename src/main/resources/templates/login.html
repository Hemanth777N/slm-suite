<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Sign in — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-mark">SLM</div>
        <h1 style="font-size:20px; margin-bottom:4px;">Sign in</h1>
        <p style="color:var(--text-muted); font-size:13.5px; margin-bottom:24px;">Service Lifecycle Management Suite</p>
        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus />
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
