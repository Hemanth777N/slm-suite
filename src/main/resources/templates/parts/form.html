<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Add / Edit Part — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">SLM</div>
            <div><div class="brand-name">SLM Suite</div><div class="brand-sub">Service Lifecycle</div></div>
        </div>
        <a th:href="@{/parts}" class="nav-link active"><span class="dot"></span>Parts</a>
    </aside>
    <main class="main" style="max-width:640px;">
        <div class="page-head"><div><span class="page-eyebrow">Inventory</span><h1>Add / Edit Part</h1></div></div>
        <div class="panel panel-pad">
            <form th:action="@{/parts/save}" th:object="${part}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="form-group"><label class="form-label">SKU</label><input type="text" th:field="*{sku}" class="form-control" required /></div>
                <div class="form-group"><label class="form-label">Name</label><input type="text" th:field="*{name}" class="form-control" required /></div>
                <div class="form-group"><label class="form-label">Category</label><input type="text" th:field="*{category}" class="form-control" /></div>
                <div class="form-group"><label class="form-label">Base Price</label><input type="number" step="0.01" th:field="*{basePrice}" class="form-control" required /></div>
                <div class="form-group"><label class="form-label">Reorder Threshold</label><input type="number" th:field="*{reorderThreshold}" class="form-control" /></div>
                <div class="form-group"><label class="form-label">Stock Quantity</label><input type="number" th:field="*{stockQuantity}" class="form-control" required /></div>
                <div class="form-group"><label class="form-label">Description</label><textarea th:field="*{description}" class="form-control" rows="3"></textarea></div>
                <div class="btn-group-row">
                    <button type="submit" class="btn btn-primary">Save Part</button>
                    <a th:href="@{/parts}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
