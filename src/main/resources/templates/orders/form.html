<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Place Order — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SLM</div><div><div class="brand-name">SLM Suite</div></div></div>
        <a th:href="@{/orders}" class="nav-link active"><span class="dot"></span>Orders</a>
    </aside>
    <main class="main" style="max-width:560px;">
        <div class="page-head"><div><span class="page-eyebrow">Operations</span><h1>Place Order</h1></div></div>
        <div class="panel panel-pad">
            <form th:action="@{/orders/place}" method="post">
                <div class="form-group">
                    <label class="form-label">Part</label>
                    <select name="partId" class="form-control" required>
                        <option th:each="p : ${parts}" th:value="${p.id}" th:text="${p.name} + ' (' + ${p.sku} + ')'"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control" min="1" required />
                </div>
                <div class="btn-group-row">
                    <button type="submit" class="btn btn-primary">Place Order</button>
                    <a th:href="@{/orders}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
