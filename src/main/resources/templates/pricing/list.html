<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Pricing Rules — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SLM</div><div><div class="brand-name">SLM Suite</div></div></div>
        <a th:href="@{/parts}" class="nav-link"><span class="dot"></span>Parts</a>
        <a th:href="@{/pricing}" class="nav-link active"><span class="dot"></span>Pricing</a>
    </aside>
    <main class="main">
        <div class="page-head">
            <div><span class="page-eyebrow">Pricing</span><h1>Pricing Rules</h1></div>
            <div class="btn-group-row">
                <a th:href="@{/pricing/quote}" class="btn btn-outline">Get Quote</a>
                <a th:href="@{/pricing/new}" class="btn btn-primary">+ Add Rule</a>
            </div>
        </div>
        <div class="panel">
            <table class="data" th:if="${!rules.isEmpty()}">
                <thead><tr><th>Part</th><th>Tier</th><th>Adjustment</th></tr></thead>
                <tbody>
                <tr th:each="r : ${rules}">
                    <td th:text="${r.part.name}"></td>
                    <td><span class="pill pill-info" th:text="${r.customerTier}"></span></td>
                    <td class="cell-mono" th:text="${r.adjustmentPercent} + '%'"></td>
                </tr>
                </tbody>
            </table>
            <div class="empty-state" th:if="${rules.isEmpty()}"><h3>No pricing rules yet</h3></div>
        </div>
    </main>
</div>
</body>
</html>
