<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Get Quote — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SLM</div><div><div class="brand-name">SLM Suite</div></div></div>
        <a th:href="@{/pricing}" class="nav-link active"><span class="dot"></span>Pricing</a>
    </aside>
    <main class="main" style="max-width:480px;">
        <div class="page-head"><div><span class="page-eyebrow">Pricing</span><h1>Get Quote</h1></div></div>
        <div th:if="${calculatedPrice}" class="alert alert-success">Calculated price: <strong th:text="${calculatedPrice}"></strong></div>
        <div class="panel panel-pad">
            <form th:action="@{/pricing/quote}" method="post">
                <div class="form-group">
                    <label class="form-label">Part</label>
                    <select name="partId" class="form-control" required>
                        <option th:each="p : ${parts}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Customer Tier</label>
                    <select name="customerTier" class="form-control" required>
                        <option value="RETAIL">RETAIL</option>
                        <option value="DEALER">DEALER</option>
                        <option value="GOLD">GOLD</option>
                    </select>
                </div>
                <div class="btn-group-row">
                    <button type="submit" class="btn btn-primary">Calculate</button>
                    <a th:href="@{/pricing}" class="btn btn-outline">Back</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
