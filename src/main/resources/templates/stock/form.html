<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Record Stock Entry — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SLM</div><div><div class="brand-name">SLM Suite</div></div></div>
        <a th:href="@{/stock}" class="nav-link active"><span class="dot"></span>Stock by Location</a>
    </aside>
    <main class="main" style="max-width:480px;">
        <div class="page-head"><div><span class="page-eyebrow">Inventory</span><h1>Record Stock Entry</h1></div></div>
        <div class="panel panel-pad">
            <form th:action="@{/stock/save}" method="post">
                <div class="form-group">
                    <label class="form-label">Part</label>
                    <select name="partId" class="form-control" required>
                        <option th:each="p : ${parts}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Warehouse</label>
                    <select name="warehouseId" class="form-control" required>
                        <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" min="0" required /></div>
                <div class="btn-group-row">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/stock}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
