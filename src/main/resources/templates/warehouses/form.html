<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>Add Warehouse — SLM Suite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SLM</div><div><div class="brand-name">SLM Suite</div></div></div>
        <a th:href="@{/warehouses}" class="nav-link active"><span class="dot"></span>Warehouses</a>
    </aside>
    <main class="main" style="max-width:480px;">
        <div class="page-head"><div><span class="page-eyebrow">Inventory</span><h1>Add Warehouse</h1></div></div>
        <div class="panel panel-pad">
            <form th:action="@{/warehouses/save}" th:object="${warehouse}" method="post">
                <div class="form-group"><label class="form-label">Name</label><input type="text" th:field="*{name}" class="form-control" required /></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" th:field="*{location}" class="form-control" required /></div>
                <div class="btn-group-row">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/warehouses}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
